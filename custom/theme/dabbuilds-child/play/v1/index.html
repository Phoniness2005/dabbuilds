<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Wimbledon Pong</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1b3c1f; /* Wimbledon dark green */
      font-family: 'Courier New', monospace;
      padding: max(4px, env(safe-area-inset-top)) max(4px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left));
    }
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      line-height: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border: 8px solid #4b286d; /* Thicker Wimbledon purple border */
      box-shadow: 0 0 0 4px #ffffff; /* White outer border for contrast */
      background-color: #2e7d32; /* Grass court green */
      image-rendering: pixelated; /* For retro SNES look */
      touch-action: none;
    }
    #score {
      position: absolute;
      top: 3%;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: clamp(22px, 5vw, 48px);
      color: #ffffff;
      text-shadow: 3px 3px #4b286d;
      pointer-events: none;
      line-height: 1.2;
    }
    #stats {
      position: absolute;
      top: 11%;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: clamp(14px, 3.2vw, 32px);
      color: #ffffff;
      text-shadow: 2px 2px #4b286d;
      pointer-events: none;
      line-height: 1.2;
    }
    #ui:empty { pointer-events: none; }
    #ui {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      text-shadow: 2px 2px #4b286d;
      font-size: clamp(18px, 4vw, 36px);
      text-align: center;
      line-height: 1.3;
    }
    #ui div {
      margin: 10px;
      padding: 12px 16px;
      cursor: pointer;
      min-height: 44px;
    }
    #ui .selected {
      background-color: #4b286d;
      color: #ffffff;
    }
    #ui .instructions {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 4%;
      width: auto;
      font-size: clamp(12px, 2.6vw, 24px);
      color: #c6ff00;
      white-space: normal;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div id="score">0 - 0</div>
    <div id="stats">Game 1 | P1 Wins: 0 | P2 Wins: 0</div>
    <div id="ui"></div>
    <canvas id="gameCanvas" width="1200" height="900"></canvas>
  </div>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score');
    const statsDisplay = document.getElementById('stats');
    const ui = document.getElementById('ui');

    // Game states
    const states = {
      MENU: 'menu',
      DIFFICULTY: 'difficulty',
      PLAYING: 'playing',
      PAUSED: 'paused',
      GAME_OVER: 'game_over',
      CELEBRATION: 'celebration',
      REMATCH: 'rematch',
      POST_WIN: 'post_win'
    };
    let gameState = states.MENU;
    let selectedOption = 0;
    let gameMode = null;
    let difficulty = null;
    const maxScore = 10; // Reduced from 15
    let gameNumber = 1;
    let player1Wins = 0;
    let player2Wins = 0;
    let lastWinner = null;
    let gameOverTimer = null;

    // Game objects
    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 12,
      speedX: 7,
      speedY: 7,
      color: '#c6ff00', // Tennis ball yellow-green
      trail: []
    };

    const paddle1 = {
      x: 30,
      y: canvas.height / 2 - 75,
      width: 15,
      height: 150,
      speed: 10,
      score: 0,
      color: '#d2b48c' // Light wood grain (tan)
    };

    const paddle2 = {
      x: canvas.width - 45,
      y: canvas.height / 2 - 75,
      width: 15,
      height: 150,
      speed: 10,
      score: 0,
      color: '#8b5a2b' // Darker wood grain (brown)
    };

    // Crowd animation state
    let crowdCheer = false;
    let crowdFrame = 0;
    const crowdFrameDelay = 8;
    let crowdFrameCounter = 0;
    const crowdFrames = 4;

    // Sound effects
    function playSound(frequency, duration) {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioCtx.createOscillator();
      oscillator.type = 'square';
      oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
      oscillator.connect(audioCtx.destination);
      oscillator.start();
      oscillator.stop(audioCtx.currentTime + duration);
    }

    // Keyboard controls
    const keys = {
      w: false,
      s: false,
      ArrowUp: false,
      ArrowDown: false,
      p: false,
      Enter: false,
      Escape: false,
      ArrowLeft: false,
      ArrowRight: false
    };

    document.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
      if (e.key in keys) keys[e.key] = true;
    });

    document.addEventListener('keyup', (e) => {
      if (e.key in keys) keys[e.key] = false;
    });

    // Draw net
    function drawNet() {
      ctx.fillStyle = '#ffffff';
      for (let y = 0; y < canvas.height; y += 30) {
        ctx.fillRect(canvas.width / 2 - 3, y, 6, 15);
      }
    }

    // Draw crowd
    function drawCrowd() {
      const crowdHeight = 75;
      const spriteSize = 24;
      ctx.fillStyle = '#4b286d';
      ctx.fillRect(0, 0, canvas.width, crowdHeight);
      ctx.fillRect(0, canvas.height - crowdHeight, canvas.width, crowdHeight);

      for (let x = 0; x < canvas.width; x += spriteSize) {
        const color = crowdCheer ? ['#ffeb3b', '#ffffff', '#c6ff00', '#ffeb3b'][crowdFrame] : '#ffffff';
        ctx.fillStyle = color;
        ctx.fillRect(x + 6, 15, 12, 12);
        ctx.fillRect(x + 6, canvas.height - crowdHeight + 15, 12, 12);
        ctx.fillStyle = crowdCheer ? '#ffffff' : '#cccccc';
        ctx.fillRect(x + 8, 17, 4, 4);
        ctx.fillRect(x + 8, canvas.height - crowdHeight + 17, 4, 4);
      }
    }

    // Draw center graphic
    function drawCenterGraphic() {
      ctx.font = '48px Courier New';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(198, 255, 0, 0.3)'; // Translucent yellow-green
      ctx.fillText('Grok/Replit Open 2025', canvas.width / 2, canvas.height / 2);
      ctx.strokeStyle = 'rgba(75, 40, 109, 0.5)'; // Translucent Wimbledon purple outline
      ctx.lineWidth = 2;
      ctx.strokeText('Grok/Replit Open 2025', canvas.width / 2, canvas.height / 2);
    }

    // Update crowd animation
    function updateCrowd() {
      if (crowdCheer) {
        crowdFrameCounter++;
        if (crowdFrameCounter >= crowdFrameDelay) {
          crowdFrame = (crowdFrame + 1) % crowdFrames;
          crowdFrameCounter = 0;
        }
      } else {
        crowdFrame = 0;
        crowdFrameCounter = 0;
      }
    }

    // AI for one-player mode
    function updateAI() {
      if (gameMode === 'one') {
        const targetY = ball.y - paddle2.height / 2;
        let aiSpeed = difficulty === 'Amateur' ? 6 : difficulty === 'Tour' ? 8 : 10;
        const error = difficulty === 'Amateur' ? 50 : difficulty === 'Tour' ? 25 : 0;
        const adjustedTarget = targetY + (Math.random() * error - error / 2);
        if (paddle2.y + paddle2.height / 2 < adjustedTarget) {
          paddle2.y += aiSpeed;
        } else if (paddle2.y + paddle2.height / 2 > adjustedTarget) {
          paddle2.y -= aiSpeed;
        }
        if (paddle2.y < 0) paddle2.y = 0;
        if (paddle2.y > canvas.height - paddle2.height) paddle2.y = canvas.height - paddle2.height;
      }
    }

    // Reset game state for new match
    function resetGame() {
      paddle1.score = 0;
      paddle2.score = 0;
      resetBall();
      paddle1.y = canvas.height / 2 - 75;
      paddle2.y = canvas.height / 2 - 75;
      scoreDisplay.textContent = `0 - 0`;
    }

    // Update game state
    function update() {
      if (gameState === states.PLAYING) {
        // Move paddles (ensure they stay within visual field)
        if (keys.w && paddle1.y > 0) paddle1.y = Math.max(0, paddle1.y - paddle1.speed);
        if (keys.s && paddle1.y < canvas.height - paddle1.height) paddle1.y = Math.min(canvas.height - paddle1.height, paddle1.y + paddle1.speed);
        if (gameMode === 'two') {
          if (keys.ArrowUp && paddle2.y > 0) paddle2.y = Math.max(0, paddle2.y - paddle2.speed);
          if (keys.ArrowDown && paddle2.y < canvas.height - paddle2.height) paddle2.y = Math.min(canvas.height - paddle2.height, paddle2.y + paddle2.speed);
        } else {
          updateAI();
        }

        // Move ball (ensure it stays within visual field)
        ball.x += ball.speedX;
        ball.y += ball.speedY;

        // Update ball trail
        ball.trail.push({ x: ball.x, y: ball.y });
        if (ball.trail.length > 5) ball.trail.shift();

        // Ball collision with top and bottom (adjusted for visibility)
        if (ball.y + ball.radius > canvas.height - 8 || ball.y - ball.radius < 8) { // Account for border thickness
          ball.speedY = -ball.speedY;
          ball.y = ball.y + ball.radius > canvas.height - 8 ? canvas.height - 8 - ball.radius : 8 + ball.radius;
          playSound(300, 0.1);
        }

        // Ball collision with paddles
        if (
          (ball.x - ball.radius < paddle1.x + paddle1.width &&
           ball.y > paddle1.y &&
           ball.y < paddle1.y + paddle1.height) ||
          (ball.x + ball.radius > paddle2.x &&
           ball.y > paddle2.y &&
           ball.y < paddle2.y + paddle2.height)
        ) {
          ball.speedX = -ball.speedX * 1.05;
          // Ensure ball stays within left/right bounds
          if (ball.x - ball.radius < paddle1.x + paddle1.width) ball.x = paddle1.x + paddle1.width + ball.radius;
          if (ball.x + ball.radius > paddle2.x) ball.x = paddle2.x - ball.radius;
          playSound(400, 0.1);
        }

        // Score points (adjusted for border)
        if (ball.x < 8) {
          paddle2.score++;
          resetBall();
          crowdCheer = true;
          playSound(200, 0.3);
        } else if (ball.x > canvas.width - 8) {
          paddle1.score++;
          resetBall();
          crowdCheer = true;
          playSound(200, 0.3);
        }

        // Check for game end
        if (paddle1.score >= maxScore || paddle2.score >= maxScore) {
          lastWinner = paddle1.score >= maxScore ? 'Player 1' : gameMode === 'two' ? 'Player 2' : 'Computer';
          if (paddle1.score >= maxScore) player1Wins++;
          else player2Wins++;
          gameState = states.REMATCH;
          selectedOption = 0;
          crowdCheer = true;
        }

        // Update crowd
        updateCrowd();

        // Pause game
        if (keys.p) {
          gameState = states.PAUSED;
          keys.p = false;
        }

        // Update stats
        statsDisplay.textContent = `Game ${gameNumber} | P1 Wins: ${player1Wins} | P2 Wins: ${player2Wins}`;
      } else if (gameState === states.PAUSED && keys.p) {
        gameState = states.PLAYING;
        keys.p = false;
      } else if (gameState === states.MENU) {
        if (keys.ArrowUp && selectedOption > 0) {
          selectedOption--;
          playSound(500, 0.1);
        }
        if (keys.ArrowDown && selectedOption < 1) {
          selectedOption++;
          playSound(500, 0.1);
        }
        if (keys.Enter) {
          gameMode = selectedOption === 0 ? 'one' : 'two';
          if (gameMode === 'one') {
            gameState = states.DIFFICULTY;
            selectedOption = 0;
          } else {
            gameState = states.PLAYING;
            ui.innerHTML = '';
          }
          keys.Enter = false;
          playSound(600, 0.2);
        }
      } else if (gameState === states.DIFFICULTY) {
        if (keys.ArrowUp && selectedOption > 0) {
          selectedOption--;
          playSound(500, 0.1);
        }
        if (keys.ArrowDown && selectedOption < 2) {
          selectedOption++;
          playSound(500, 0.1);
        }
        if (keys.Enter) {
          difficulty = ['Amateur', 'Tour', 'Pro'][selectedOption];
          gameState = states.PLAYING;
          ui.innerHTML = '';
          keys.Enter = false;
          playSound(600, 0.2);
        }
      } else if (gameState === states.REMATCH) {
        if (keys.ArrowUp && selectedOption > 0) {
          selectedOption--;
          playSound(500, 0.1);
        }
        if (keys.ArrowDown && selectedOption < 1) {
          selectedOption++;
          playSound(500, 0.1);
        }
        if (keys.Enter) {
          if (selectedOption === 0) {
            gameState = states.POST_WIN;
            setTimeout(() => {
              gameState = states.PLAYING;
              gameNumber++;
              resetGame();
              ui.innerHTML = '';
            }, 2000);
          } else {
            gameState = states.MENU;
            selectedOption = 0;
            gameNumber = 1;
            player1Wins = 0;
            player2Wins = 0;
            resetGame();
          }
          keys.Enter = false;
          playSound(600, 0.2);
        }
      } else if (gameState === states.GAME_OVER) {
        if (!gameOverTimer) {
          gameOverTimer = setTimeout(() => {
            gameState = states.MENU;
            selectedOption = 0;
            gameNumber = 1;
            player1Wins = 0;
            player2Wins = 0;
            resetGame();
            gameOverTimer = null;
            ui.innerHTML = '';
          }, 5000);
        }
      }

      // Game over on Escape
      if (keys.Escape && gameState !== states.GAME_OVER) {
        gameState = states.GAME_OVER;
        keys.Escape = false;
        crowdCheer = false;
        playSound(150, 0.5);
      }
    }

    // Reset ball
    function resetBall() {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speedX = (Math.random() > 0.5 ? 7 : -7) * (Math.random() * 0.5 + 0.75);
      ball.speedY = (Math.random() > 0.5 ? 7 : -7) * (Math.random() * 0.5 + 0.75);
      ball.trail = [];
      setTimeout(() => { crowdCheer = false; }, 1000);
    }

    // Draw game
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawCrowd();
      drawNet();
      drawCenterGraphic();

      if (gameState === states.PLAYING || gameState === states.PAUSED) {
        // Draw paddles
        ctx.fillStyle = paddle1.color;
        ctx.fillRect(paddle1.x, paddle1.y, paddle1.width, paddle1.height);
        ctx.fillStyle = paddle2.color;
        ctx.fillRect(paddle2.x, paddle2.y, paddle2.width, paddle2.height);

        // Draw ball trail
        ball.trail.forEach((pos, i) => {
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, ball.radius * (0.5 + 0.1 * i), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(198, 255, 0, ${0.2 * (i / ball.trail.length)})`;
          ctx.fill();
          ctx.closePath();
        });

        // Draw ball
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = ball.color;
        ctx.fill();
        ctx.closePath();

        // Update score
        scoreDisplay.textContent = `${paddle1.score} - ${paddle2.score}`;

        // Draw pause message
        if (gameState === states.PAUSED) {
          ctx.fillStyle = '#ffffff';
          ctx.font = '64px Courier New';
          ctx.textAlign = 'center';
          ctx.fillText('Paused', canvas.width / 2, canvas.height / 2);
        }
      } else if (gameState === states.MENU) {
        ui.innerHTML = `
          <div data-choice="0" class="${selectedOption === 0 ? 'selected' : ''}">One Player</div>
          <div data-choice="1" class="${selectedOption === 1 ? 'selected' : ''}">Two Players</div>
          <div class="instructions">
            Tap a choice, or use arrows and Enter. Drag the court to move. Player 1: W / S, P pause${selectedOption === 1 ? '<br>Player 2: Arrow Up, Arrow Down' : ''}
          </div>
        `;
        statsDisplay.textContent = `Game ${gameNumber} | P1 Wins: ${player1Wins} | P2 Wins: ${player2Wins}`;
      } else if (gameState === states.DIFFICULTY) {
        ui.innerHTML = `
          <div data-choice="0" class="${selectedOption === 0 ? 'selected' : ''}">Amateur</div>
          <div data-choice="1" class="${selectedOption === 1 ? 'selected' : ''}">Tour</div>
          <div data-choice="2" class="${selectedOption === 2 ? 'selected' : ''}">Pro</div>
          <div class="instructions">
            Tap a skill. Player 1: W / S or drag, P pause
          </div>
        `;
      } else if (gameState === states.REMATCH) {
        ui.innerHTML = `
          <div>Do you want another match?</div>
          <div data-choice="0" class="${selectedOption === 0 ? 'selected' : ''}">Yes</div>
          <div data-choice="1" class="${selectedOption === 1 ? 'selected' : ''}">No</div>
        `;
        scoreDisplay.textContent = `${paddle1.score} - ${paddle2.score}`;
      } else if (gameState === states.POST_WIN) {
        ui.innerHTML = `
          <div>Good job, ${lastWinner}!</div>
        `;
        scoreDisplay.textContent = `${paddle1.score} - ${paddle2.score}`;
      } else if (gameState === states.GAME_OVER) {
        ui.innerHTML = `
          <div>Game Over</div>
        `;
        scoreDisplay.textContent = `${paddle1.score} - ${paddle2.score}`;
      }
    }

    // Game loop
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function canvasPointerY(clientY) {
      const rect = canvas.getBoundingClientRect();
      return ((clientY - rect.top) / rect.height) * canvas.height;
    }
    function movePaddleFromPointer(clientY, paddle) {
      paddle.y = canvasPointerY(clientY) - paddle.height / 2;
      if (paddle.y < 0) paddle.y = 0;
      if (paddle.y > canvas.height - paddle.height) paddle.y = canvas.height - paddle.height;
    }
    canvas.addEventListener('mousemove', (e) => {
      if (gameState !== states.PLAYING) return;
      movePaddleFromPointer(e.clientY, paddle1);
    });
    canvas.addEventListener('touchstart', (e) => {
      if (gameState !== states.PLAYING) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      for (let i = 0; i < e.touches.length; i++) {
        const t = e.touches[i];
        const x = (t.clientX - rect.left) / rect.width;
        if (gameMode === 'two' && x > 0.5) movePaddleFromPointer(t.clientY, paddle2);
        else movePaddleFromPointer(t.clientY, paddle1);
      }
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
      if (gameState !== states.PLAYING) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      for (let i = 0; i < e.touches.length; i++) {
        const t = e.touches[i];
        const x = (t.clientX - rect.left) / rect.width;
        if (gameMode === 'two' && x > 0.5) movePaddleFromPointer(t.clientY, paddle2);
        else movePaddleFromPointer(t.clientY, paddle1);
      }
    }, { passive: false });
    ui.addEventListener('click', (e) => {
      const choice = e.target.closest('[data-choice]');
      if (!choice) return;
      selectedOption = Number(choice.getAttribute('data-choice'));
      keys.Enter = true;
    });

    // Start game
    resetBall();
    gameLoop();
  </script>
</body>
</html>
