<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Wimbledon Pong — Version 2</title>
  <style>
    :root {
      --purple: #4b286d;
      --purple-deep: #2a1540;
      --green-bg: #122616;
      --white: #f4f7f2;
      --ball: #d4ff3f;
      --ink: #f7f3ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      background: radial-gradient(ellipse at center, #1e4a24 0%, var(--green-bg) 70%);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    }
    .shell {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      gap: 6px;
    }
    .hud {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 8px;
      padding: 4px 6px 0;
      color: var(--white);
      text-shadow: 0 2px 0 var(--purple-deep);
    }
    .hud .side { font-size: 14px; letter-spacing: 0.04em; }
    .hud .side.right { text-align: right; }
    .hud .score {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 800;
      letter-spacing: 0.12em;
      text-align: center;
    }
    .hud .meta {
      grid-column: 1 / -1;
      text-align: center;
      font-size: 13px;
      opacity: 0.92;
    }
    .court-frame {
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0c1a0e;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
      line-height: 0;
    }
    .court-inner {
      position: relative;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #16331a;
      touch-action: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(18, 8, 28, 0.58);
      color: var(--white);
      text-align: center;
      padding: 16px;
      gap: 10px;
      line-height: 1.4;
    }
    .overlay.hidden { display: none; }
    .overlay h2 {
      margin: 0 0 4px;
      font-size: clamp(22px, 4vw, 36px);
      text-shadow: 0 3px 0 var(--purple-deep);
    }
    .overlay p.lead {
      margin: 0 0 8px;
      max-width: 36rem;
      font-size: 15px;
      line-height: 1.45;
      color: #efe7ff;
    }
    .menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: min(360px, 92%);
    }
    .menu button {
      appearance: none;
      border: 2px solid #d7c4ee;
      background: var(--purple);
      color: var(--white);
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      padding: 12px 16px;
      min-height: 52px;
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .menu button .hint {
      display: block;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.35;
      opacity: 0.88;
    }
    .menu button[aria-selected="true"],
    .menu button:hover,
    .menu button:focus-visible {
      background: #6a3d96;
      border-color: var(--ball);
      outline: none;
    }
    .help {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      padding: 2px 4px 0;
      color: #e6ffb0;
    }
    .help #help {
      flex: 1;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    kbd {
      display: inline-block;
      border: 1px solid #c6ff00;
      padding: 0 5px;
      font-family: inherit;
      font-size: 12px;
      background: rgba(0,0,0,0.25);
    }
    .help button, .touch-bar button {
      appearance: none;
      border: 2px solid #d7c4ee;
      background: var(--purple);
      color: var(--white);
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      min-height: 48px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .help button:hover, .touch-bar button:hover,
    .help button:focus-visible, .touch-bar button:focus-visible {
      border-color: var(--ball);
      outline: none;
    }
    .touch-bar {
      display: none;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .touch-bar.two-player { grid-template-columns: 1fr 1fr 1fr 1fr; }
    .touch-bar.show { display: grid; }
    @media (pointer: coarse), (max-width: 720px) {
      .touch-bar { display: grid; grid-template-columns: 1fr 1fr; }
      .touch-bar #btnPause { grid-column: 1 / -1; }
      .hud .side { font-size: 12px; }
      .overlay { padding: 8px; overflow: auto; }
      .overlay p.lead { font-size: 14px; }
      .overlay h2 { font-size: 22px; }
      .menu { min-width: 0; width: 100%; }
      .help { flex-direction: column; align-items: stretch; }
      .help #help { flex-direction: column; }
      .help button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hud">
      <div class="side" id="p1Label">You — <kbd>W</kbd> <kbd>S</kbd> or mouse</div>
      <div class="score" id="score">0 — 0</div>
      <div class="side right" id="p2Label">Opponent</div>
      <div class="meta" id="meta">First to 10 · Game 1 · You 0 — Opponent 0</div>
    </div>
    <div class="court-frame" id="courtFrame">
      <div class="court-inner" id="courtInner">
        <canvas id="gameCanvas" width="1600" height="900"></canvas>
        <div class="overlay" id="overlay"></div>
      </div>
    </div>
    <div class="touch-bar" id="touchBar">
      <button type="button" id="btnUp" aria-label="Move up">Up</button>
      <button type="button" id="btnDown" aria-label="Move down">Down</button>
      <button type="button" id="btnPause">Pause</button>
    </div>
    <div class="help">
      <div id="help"></div>
      <button type="button" id="fullBtn">Full screen</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    const overlay = document.getElementById('overlay');
    const scoreEl = document.getElementById('score');
    const metaEl = document.getElementById('meta');
    const p1Label = document.getElementById('p1Label');
    const p2Label = document.getElementById('p2Label');
    const helpEl = document.getElementById('help');

    const W = canvas.width;
    const H = canvas.height;
    const WHITE = 8;
    const PURPLE = 18;
    const STAND = 74;
    const PLAY_TOP = WHITE + PURPLE + STAND;
    const PLAY_BOTTOM = H - WHITE - PURPLE - STAND;
    const PLAY_LEFT = WHITE + PURPLE;
    const PLAY_RIGHT = W - WHITE - PURPLE;
    const MAX_SCORE = 10;

    const STATES = {
      MENU: 'menu',
      DIFFICULTY: 'difficulty',
      PLAYING: 'playing',
      PAUSED: 'paused',
      REMATCH: 'rematch'
    };

    const DIFF = {
      Amateur: {
        speed: 3.5,
        reaction: 38,
        error: 96,
        predict: 0,
        chaseAway: false,
        accel: 0.22,
        whiff: 0.2,
        label: 'Amateur',
        hint: 'Weekend hit. Slow to the ball and misses a lot.'
      },
      Tour: {
        speed: 6.3,
        reaction: 14,
        error: 34,
        predict: 0.26,
        chaseAway: false,
        accel: 0.46,
        whiff: 0.05,
        label: 'Tour',
        hint: 'Club match. Keeps up, still leaves you an opening.'
      },
      Pro: {
        speed: 8.7,
        reaction: 5,
        error: 12,
        predict: 0.7,
        chaseAway: true,
        accel: 0.74,
        whiff: 0,
        label: 'Pro',
        hint: 'Reads the bounce. Mix the pace or it will pin you.'
      }
    };

    let state = STATES.MENU;
    let selected = 0;
    let mode = 'one';
    let difficulty = 'Tour';
    let gameNumber = 1;
    let p1Wins = 0;
    let p2Wins = 0;
    let lastWinner = '';
    let crowdCheer = 0;
    let overlayDirty = true;
    let serveHold = 0;
    let mouseLive = 0;
    let mouseLive2 = 0;
    let coarse = window.matchMedia('(pointer: coarse)').matches;

    const ball = { x: W / 2, y: H / 2, r: 12, vx: 7, vy: 5, trail: [] };
    const p1 = { x: PLAY_LEFT + 28, y: H / 2 - 78, w: 22, h: 156, speed: 9.4, vy: 0, score: 0 };
    const p2 = { x: PLAY_RIGHT - 50, y: H / 2 - 78, w: 22, h: 156, speed: 9.4, vy: 0, score: 0 };
    const ai = { think: 0, target: H / 2 - 78, offset: 0 };

    const keys = {};
    const assets = { grass: null, woodLight: null, woodDark: null, seats: null, ready: false };
    const patterns = { grass: null, seats: null };

    function loadImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    function makePattern(img, tile) {
      if (!img) return null;
      const off = document.createElement('canvas');
      off.width = off.height = tile;
      off.getContext('2d').drawImage(img, 0, 0, tile, tile);
      return ctx.createPattern(off, 'repeat');
    }

    const ASSET_BASE = location.pathname.indexOf('/play/') === 0
      ? '/wp-content/themes/dabbuilds-child/play/v2/assets/'
      : 'assets/';

    Promise.all([
      loadImage(ASSET_BASE + 'grass.jpg'),
      loadImage(ASSET_BASE + 'wood-light.jpg'),
      loadImage(ASSET_BASE + 'wood-dark.jpg'),
      loadImage(ASSET_BASE + 'seats.jpg')
    ]).then(([g, l, d, s]) => {
      assets.grass = g;
      assets.woodLight = l;
      assets.woodDark = d;
      assets.seats = s;
      patterns.grass = makePattern(g, 256);
      patterns.seats = makePattern(s, 192);
      assets.ready = true;
    });

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    function paddleBounds(p) {
      p.y = clamp(p.y, PLAY_TOP + 4, PLAY_BOTTOM - p.h - 4);
    }

    function resetBall(toRight) {
      ball.x = W / 2;
      ball.y = (PLAY_TOP + PLAY_BOTTOM) / 2;
      const dir = toRight === undefined ? (Math.random() > 0.5 ? 1 : -1) : (toRight ? 1 : -1);
      const speed = 6.8;
      const angle = (Math.random() * 0.7 - 0.35);
      ball.vx = dir * speed * Math.cos(angle);
      ball.vy = speed * Math.sin(angle) * 1.35;
      if (Math.abs(ball.vy) < 2.2) ball.vy = (Math.random() > 0.5 ? 2.6 : -2.6);
      ball.trail = [];
      serveHold = 55;
    }

    function resetMatch() {
      p1.score = 0;
      p2.score = 0;
      p1.y = (PLAY_TOP + PLAY_BOTTOM) / 2 - p1.h / 2;
      p2.y = (PLAY_TOP + PLAY_BOTTOM) / 2 - p2.h / 2;
      resetBall();
      updateHud();
    }

    function updateHud() {
      const rightName = mode === 'two' ? 'Player 2' : 'Computer';
      scoreEl.textContent = p1.score + ' — ' + p2.score;
      metaEl.textContent = 'First to ' + MAX_SCORE + ' · Game ' + gameNumber + ' · You ' + p1Wins + ' — ' + rightName + ' ' + p2Wins;
      p1Label.innerHTML = mode === 'two'
        ? 'Player 1 — <kbd>W</kbd> <kbd>S</kbd> or mouse'
        : 'You — <kbd>W</kbd> <kbd>S</kbd> or mouse';
      p2Label.textContent = mode === 'two' ? 'Player 2 — ↑ ↓' : (DIFF[difficulty].label + ' opponent');
      if (state === STATES.PLAYING) {
        helpEl.innerHTML = mode === 'two'
          ? '<span>Left half of the court: player 1. Right half: player 2. Or use keys.</span><span><kbd>P</kbd> pause · <kbd>Esc</kbd> menu</span>'
          : '<span>Drag on the court, use Up/Down, or <kbd>W</kbd> <kbd>S</kbd>.</span><span><kbd>P</kbd> pause · <kbd>Esc</kbd> menu</span>';
      } else if (state === STATES.PAUSED) {
        helpEl.innerHTML = '<span>Paused. Score stays put.</span><span><kbd>P</kbd> resume · <kbd>Esc</kbd> menu</span>';
      } else if (state === STATES.DIFFICULTY) {
        helpEl.innerHTML = '<span>Tap a skill, or use <kbd>↑</kbd> <kbd>↓</kbd> and <kbd>Enter</kbd>.</span><span><kbd>Esc</kbd> goes back.</span>';
      } else {
        helpEl.innerHTML = '<span>Tap a choice, or use <kbd>↑</kbd> <kbd>↓</kbd> and <kbd>Enter</kbd>.</span><span>The yellow ball is yours to keep in play.</span>';
      }
      const bar = document.getElementById('touchBar');
      bar.classList.toggle('show', coarse || window.matchMedia('(pointer: coarse)').matches || window.innerWidth < 720);
      bar.classList.toggle('two-player', mode === 'two' && state === STATES.PLAYING);
      document.getElementById('btnPause').textContent = state === STATES.PAUSED ? 'Resume' : 'Pause';
    }

    function predictIntercept() {
      let x = ball.x;
      let y = ball.y;
      let vx = ball.vx;
      let vy = ball.vy;
      const top = PLAY_TOP + ball.r + 4;
      const bot = PLAY_BOTTOM - ball.r - 4;
      const goal = p2.x;
      let hops = 0;
      if (vx <= 0) return y;
      while (x < goal && hops++ < 700) {
        x += vx;
        y += vy;
        if (y < top) { y = top + (top - y); vy = -vy; }
        if (y > bot) { y = bot - (y - bot); vy = -vy; }
      }
      return y;
    }

    function updateAI() {
      const cfg = DIFF[difficulty];
      const coming = ball.vx > 0;
      ai.think++;
      if (ai.think >= cfg.reaction) {
        ai.think = 0;
        if (!coming && !cfg.chaseAway) {
          ai.target = (PLAY_TOP + PLAY_BOTTOM) / 2 - p2.h / 2;
          ai.offset = 0;
        } else {
          const predicted = coming ? predictIntercept() : ball.y;
          const mix = ball.y * (1 - cfg.predict) + predicted * cfg.predict;
          ai.offset = (Math.random() * 2 - 1) * cfg.error;
          if (cfg.whiff && Math.random() < cfg.whiff) {
            ai.offset += (Math.random() > 0.5 ? 1 : -1) * (p2.h * 0.85);
          }
          ai.target = mix + ai.offset - p2.h / 2;
        }
      }
      const dy = ai.target - p2.y;
      const step = clamp(dy * cfg.accel, -cfg.speed, cfg.speed);
      if (Math.abs(dy) > 3) p2.y += step;
      paddleBounds(p2);
    }

    function bounceOffPaddle(p, dir) {
      const rel = clamp((ball.y - (p.y + p.h / 2)) / (p.h / 2), -1, 1);
      const mag = Math.min(13.2, Math.hypot(ball.vx, ball.vy) * 1.048 + 0.18);
      const ang = rel * 0.72;
      ball.vx = dir * mag * Math.cos(ang);
      ball.vy = mag * Math.sin(ang);
      if (Math.abs(ball.vx) < 4.2) ball.vx = dir * 4.4;
      ball.x = dir > 0 ? p.x + p.w + ball.r + 0.5 : p.x - ball.r - 0.5;
      crowdCheer = 14;
      beep(430, 0.07);
    }

    let audioCtx;
    function beep(freq, dur) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'square';
        o.frequency.value = freq;
        g.gain.value = 0.035;
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch (err) { /* ignore blocked audio */ }
    }

    function startPlaying() {
      state = STATES.PLAYING;
      overlay.classList.add('hidden');
      overlayDirty = true;
      resetMatch();
      updateHud();
    }

    function renderOverlay() {
      if (!overlayDirty) return;
      overlayDirty = false;
      if (state === STATES.PLAYING) {
        overlay.classList.add('hidden');
        overlay.innerHTML = '';
        return;
      }
      overlay.classList.remove('hidden');
      if (state === STATES.MENU) {
        overlay.innerHTML = `
          <h2>Wimbledon Pong</h2>
          <p class="lead">Centre Court colours. First to ${MAX_SCORE} takes the game. Tap a button. On a phone, drag the court to move.</p>
          <div class="menu" role="listbox" aria-label="Game mode">
            <button type="button" data-action="one" aria-selected="${selected===0}">One player<span class="hint">You on the left. Computer on the right. Mouse or W/S.</span></button>
            <button type="button" data-action="two" aria-selected="${selected===1}">Two players<span class="hint">Same keyboard. Left: W/S. Right: arrow keys.</span></button>
          </div>`;
      } else if (state === STATES.DIFFICULTY) {
        const keysDiff = Object.keys(DIFF);
        overlay.innerHTML = `
          <h2>Pick your opponent</h2>
          <p class="lead">Start on Tour if you are not sure. You can change this every match.</p>
          <div class="menu" role="listbox" aria-label="Difficulty">
            ${keysDiff.map((k, i) => `<button type="button" data-action="${k}" aria-selected="${selected===i}">${DIFF[k].label}<span class="hint">${DIFF[k].hint}</span></button>`).join('')}
            <button type="button" data-action="back" aria-selected="${selected===3}">Back<span class="hint">Return to one player / two players.</span></button>
          </div>`;
      } else if (state === STATES.PAUSED) {
        overlay.innerHTML = `
          <h2>Paused</h2>
          <p class="lead">Take a breath. The score stays put.</p>
          <div class="menu">
            <button type="button" data-action="resume" aria-selected="${selected===0}">Resume</button>
            <button type="button" data-action="menu" aria-selected="${selected===1}">Back to menu</button>
          </div>`;
      } else if (state === STATES.REMATCH) {
        overlay.innerHTML = `
          <h2>${lastWinner} takes it</h2>
          <p class="lead">${p1.score} — ${p2.score}. Another game, or back to the menu?</p>
          <div class="menu">
            <button type="button" data-action="again" aria-selected="${selected===0}">Play again</button>
            <button type="button" data-action="menu" aria-selected="${selected===1}">Menu</button>
          </div>`;
      }
      overlay.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', () => chooseAction(btn.dataset.action));
      });
      updateHud();
    }

    function chooseAction(action) {
      if (state === STATES.MENU) {
        if (action === 'one') {
          mode = 'one';
          state = STATES.DIFFICULTY;
          selected = 1;
        } else if (action === 'two') {
          mode = 'two';
          startPlaying();
          beep(620, 0.08);
          return;
        }
        overlayDirty = true;
        beep(620, 0.08);
      } else if (state === STATES.DIFFICULTY) {
        if (action === 'back') {
          state = STATES.MENU;
          selected = 0;
        } else if (DIFF[action]) {
          difficulty = action;
          startPlaying();
          beep(620, 0.08);
          return;
        }
        overlayDirty = true;
        beep(500, 0.08);
      } else if (state === STATES.PAUSED) {
        if (action === 'resume') state = STATES.PLAYING;
        else goMenu();
        overlayDirty = true;
        beep(500, 0.08);
      } else if (state === STATES.REMATCH) {
        if (action === 'again') {
          gameNumber++;
          startPlaying();
        } else {
          goMenu();
        }
        beep(620, 0.08);
      }
    }

    function chooseIndex(i) {
      if (state === STATES.MENU) chooseAction(i === 0 ? 'one' : 'two');
      else if (state === STATES.DIFFICULTY) chooseAction(['Amateur', 'Tour', 'Pro', 'back'][i]);
      else if (state === STATES.PAUSED) chooseAction(i === 0 ? 'resume' : 'menu');
      else if (state === STATES.REMATCH) chooseAction(i === 0 ? 'again' : 'menu');
    }

    function goMenu() {
      state = STATES.MENU;
      selected = 0;
      gameNumber = 1;
      p1Wins = 0;
      p2Wins = 0;
      resetMatch();
      overlayDirty = true;
    }

    function menuMax() {
      if (state === STATES.DIFFICULTY) return 3;
      if (state === STATES.MENU || state === STATES.PAUSED || state === STATES.REMATCH) return 1;
      return 0;
    }

    function moveMenu(delta) {
      selected = clamp(selected + delta, 0, menuMax());
      overlayDirty = true;
      beep(480, 0.045);
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
      keys[e.key] = true;
      if (e.repeat) return;
      if (e.key === 'p' || e.key === 'P') {
        if (state === STATES.PLAYING) {
          state = STATES.PAUSED;
          selected = 0;
          overlayDirty = true;
        } else if (state === STATES.PAUSED) {
          state = STATES.PLAYING;
          overlayDirty = true;
        }
      }
      if (e.key === 'Escape') {
        if (state === STATES.DIFFICULTY) {
          state = STATES.MENU;
          selected = 0;
          overlayDirty = true;
        } else {
          goMenu();
        }
      }
      if (state === STATES.MENU || state === STATES.DIFFICULTY || state === STATES.PAUSED || state === STATES.REMATCH) {
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') moveMenu(-1);
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') moveMenu(1);
        if (e.key === 'Enter') chooseIndex(selected);
      }
    });
    window.addEventListener('keyup', (e) => { keys[e.key] = false; });

    function pointerToPaddle(paddle, clientY, flag) {
      const rect = canvas.getBoundingClientRect();
      const y = ((clientY - rect.top) / rect.height) * H;
      paddle.y = y - paddle.h / 2;
      paddleBounds(paddle);
      if (flag === 2) mouseLive2 = 24;
      else mouseLive = 24;
    }

    function applyPointer(clientX, clientY) {
      if (state !== STATES.PLAYING) return;
      const rect = canvas.getBoundingClientRect();
      const x = ((clientX - rect.left) / rect.width) * W;
      if (mode === 'two' && x > W / 2) pointerToPaddle(p2, clientY, 2);
      else pointerToPaddle(p1, clientY, 1);
    }

    canvas.addEventListener('mousemove', (e) => {
      applyPointer(e.clientX, e.clientY);
    });
    canvas.addEventListener('touchstart', (e) => {
      coarse = true;
      document.getElementById('touchBar').classList.add('show');
      if (state !== STATES.PLAYING) return;
      e.preventDefault();
      for (let i = 0; i < e.touches.length; i++) applyPointer(e.touches[i].clientX, e.touches[i].clientY);
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
      if (state !== STATES.PLAYING) return;
      e.preventDefault();
      for (let i = 0; i < e.touches.length; i++) applyPointer(e.touches[i].clientX, e.touches[i].clientY);
    }, { passive: false });

    function holdKey(key, el) {
      const down = (e) => { e.preventDefault(); keys[key] = true; coarse = true; };
      const up = () => { keys[key] = false; };
      el.addEventListener('pointerdown', down);
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
    }
    holdKey('w', document.getElementById('btnUp'));
    holdKey('s', document.getElementById('btnDown'));
    document.getElementById('btnPause').addEventListener('click', () => {
      if (state === STATES.PLAYING) {
        state = STATES.PAUSED;
        selected = 0;
        overlayDirty = true;
      } else if (state === STATES.PAUSED) {
        state = STATES.PLAYING;
        overlayDirty = true;
      }
      updateHud();
    });
    document.getElementById('fullBtn').addEventListener('click', async () => {
      const root = document.documentElement;
      try {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (root.requestFullscreen) await root.requestFullscreen();
          else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
        } else if (document.exitFullscreen) {
          await document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      } catch (err) { /* ignore */ }
      requestAnimationFrame(fitCourt);
    });

    function fitCourt() {
      const frame = document.getElementById('courtFrame');
      const inner = document.getElementById('courtInner');
      const fw = frame.clientWidth;
      const fh = frame.clientHeight;
      if (fw < 8 || fh < 8) return;
      const aspect = W / H;
      const portrait = fh / fw > 1.05;
      let w = fw;
      let h = fh;
      if (!portrait) {
        h = w / aspect;
        if (h > fh) {
          h = fh;
          w = h * aspect;
        }
      }
      inner.style.width = Math.floor(w) + 'px';
      inner.style.height = Math.floor(h) + 'px';
    }
    window.addEventListener('resize', fitCourt);
    if (window.visualViewport) visualViewport.addEventListener('resize', fitCourt);
    document.addEventListener('fullscreenchange', fitCourt);

    function hitPaddle(p) {
      return ball.x + ball.r > p.x &&
        ball.x - ball.r < p.x + p.w &&
        ball.y + ball.r > p.y &&
        ball.y - ball.r < p.y + p.h;
    }

    function scorePoint(scorer) {
      crowdCheer = 42;
      beep(scorer === 1 ? 620 : 180, 0.22);
      if (scorer === 1) p1.score++;
      else p2.score++;
      if ((scorer === 1 ? p1.score : p2.score) >= MAX_SCORE) {
        lastWinner = scorer === 1
          ? (mode === 'two' ? 'Player 1' : 'You')
          : (mode === 'two' ? 'Player 2' : 'The computer');
        if (scorer === 1) p1Wins++; else p2Wins++;
        state = STATES.REMATCH;
        selected = 0;
        overlayDirty = true;
      } else {
        resetBall(scorer === 2);
      }
      updateHud();
    }

    function update() {
      if (state !== STATES.PLAYING) return;
      if (mouseLive > 0) mouseLive--;
      if (mouseLive2 > 0) mouseLive2--;
      if (mouseLive === 0) {
        if (keys.w || keys.W) p1.y -= p1.speed;
        if (keys.s || keys.S) p1.y += p1.speed;
        paddleBounds(p1);
      }
      if (mode === 'two') {
        if (mouseLive2 === 0) {
          if (keys.ArrowUp) p2.y -= p2.speed;
          if (keys.ArrowDown) p2.y += p2.speed;
          paddleBounds(p2);
        }
      } else {
        updateAI();
      }

      if (serveHold > 0) {
        serveHold--;
        return;
      }

      const dist = Math.hypot(ball.vx, ball.vy);
      const steps = Math.max(1, Math.ceil(dist / 7));
      const sx = ball.vx / steps;
      const sy = ball.vy / steps;
      for (let i = 0; i < steps; i++) {
        ball.x += sx;
        ball.y += sy;
        if (ball.y - ball.r < PLAY_TOP) {
          ball.y = PLAY_TOP + ball.r;
          ball.vy = Math.abs(ball.vy);
          beep(280, 0.05);
        } else if (ball.y + ball.r > PLAY_BOTTOM) {
          ball.y = PLAY_BOTTOM - ball.r;
          ball.vy = -Math.abs(ball.vy);
          beep(280, 0.05);
        }
        if (ball.vx < 0 && hitPaddle(p1)) bounceOffPaddle(p1, 1);
        else if (ball.vx > 0 && hitPaddle(p2)) bounceOffPaddle(p2, -1);
        if (ball.x + ball.r < PLAY_LEFT) {
          scorePoint(2);
          return;
        }
        if (ball.x - ball.r > PLAY_RIGHT) {
          scorePoint(1);
          return;
        }
      }
      ball.trail.push({ x: ball.x, y: ball.y });
      if (ball.trail.length > 10) ball.trail.shift();
      if (crowdCheer > 0) crowdCheer--;
    }

    function drawRoundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawPaddle(p, img) {
      ctx.save();
      drawRoundRect(p.x, p.y, p.w, p.h, 8);
      ctx.clip();
      if (img) {
        const tileH = p.w * 2.4;
        for (let yy = p.y - 4; yy < p.y + p.h + 4; yy += tileH) {
          ctx.drawImage(img, p.x, yy, p.w, tileH);
        }
      } else {
        ctx.fillStyle = '#c4a574';
        ctx.fillRect(p.x, p.y, p.w, p.h);
      }
      const gloss = ctx.createLinearGradient(p.x, p.y, p.x + p.w, p.y);
      gloss.addColorStop(0, 'rgba(255,255,255,0.32)');
      gloss.addColorStop(0.45, 'rgba(255,255,255,0)');
      gloss.addColorStop(1, 'rgba(0,0,0,0.28)');
      ctx.fillStyle = gloss;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = 'rgba(250,250,250,0.28)';
      ctx.fillRect(p.x, p.y + p.h / 2 - 11, p.w, 22);
      ctx.restore();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      drawRoundRect(p.x + 0.8, p.y + 0.8, p.w - 1.6, p.h - 1.6, 8);
      ctx.stroke();
    }

    function drawBall() {
      ball.trail.forEach((t, i) => {
        ctx.beginPath();
        ctx.arc(t.x, t.y, ball.r * (0.3 + i / 18), 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(212,255,63,' + (0.06 + i * 0.025) + ')';
        ctx.fill();
      });
      const g = ctx.createRadialGradient(ball.x - 3, ball.y - 4, 2, ball.x, ball.y, ball.r);
      g.addColorStop(0, '#f7ffb0');
      g.addColorStop(0.45, '#d4ff3f');
      g.addColorStop(1, '#6f9800');
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(ball.x - ball.r * 0.12, ball.y, ball.r * 0.92, -1.2, 1.2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(ball.x + ball.r * 0.12, ball.y, ball.r * 0.92, Math.PI - 1.2, Math.PI + 1.2);
      ctx.stroke();
    }

    function drawCrowd(y, h) {
      if (patterns.seats) {
        ctx.fillStyle = patterns.seats;
        ctx.fillRect(PLAY_LEFT, y, PLAY_RIGHT - PLAY_LEFT, h);
      } else {
        ctx.fillStyle = '#4b286d';
        ctx.fillRect(PLAY_LEFT, y, PLAY_RIGHT - PLAY_LEFT, h);
      }
      ctx.fillStyle = 'rgba(20, 8, 32, 0.28)';
      ctx.fillRect(PLAY_LEFT, y, PLAY_RIGHT - PLAY_LEFT, h);
      const rows = 3;
      const rowH = h / rows;
      const bounce = crowdCheer > 0 ? Math.sin(Date.now() / 75) * 3 : 0;
      const skins = ['#f1d3b5', '#c68642', '#8d5524', '#e0ac69', '#ffdbac'];
      for (let row = 0; row < rows; row++) {
        const baseY = y + row * rowH + rowH * 0.38;
        for (let x = PLAY_LEFT + 12 + (row % 2) * 9; x < PLAY_RIGHT - 10; x += 17) {
          const j = ((x * 13 + row * 7) % 5) - 2;
          const headY = baseY + j + bounce * ((x + row) % 2 === 0 ? 1 : 0.4);
          ctx.fillStyle = crowdCheer ? ['#fff4a3', '#ffffff', '#d4ff3f'][(x / 17 + (crowdCheer >> 2)) % 3] : '#f3eee4';
          ctx.fillRect(x + 2, headY + 5, 9, rowH * 0.5);
          ctx.beginPath();
          ctx.fillStyle = skins[(x + row) % skins.length];
          ctx.arc(x + 6.5, headY, 4.6, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawCourtLines() {
      const innerX = PLAY_LEFT;
      const innerY = PLAY_TOP;
      const innerW = PLAY_RIGHT - PLAY_LEFT;
      const innerH = PLAY_BOTTOM - PLAY_TOP;
      ctx.save();
      ctx.beginPath();
      ctx.rect(innerX, innerY, innerW, innerH);
      ctx.clip();
      if (patterns.grass) {
        ctx.fillStyle = patterns.grass;
        ctx.fillRect(innerX, innerY, innerW, innerH);
      } else {
        ctx.fillStyle = '#2e7d32';
        ctx.fillRect(innerX, innerY, innerW, innerH);
      }
      const stripe = 48;
      for (let y = innerY, i = 0; y < PLAY_BOTTOM; y += stripe, i++) {
        ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.055)' : 'rgba(0,20,0,0.1)';
        ctx.fillRect(innerX, y, innerW, stripe);
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.88)';
      ctx.lineWidth = 4;
      ctx.strokeRect(innerX + 14, innerY + 12, innerW - 28, innerH - 24);
      ctx.strokeRect(innerX + 52, innerY + 12, innerW - 104, innerH - 24);
      ctx.beginPath();
      ctx.moveTo(W / 2, innerY + 12);
      ctx.lineTo(W / 2, PLAY_BOTTOM - 12);
      ctx.stroke();
      ctx.setLineDash([10, 12]);
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(innerX + 52, (innerY + PLAY_BOTTOM) / 2);
      ctx.lineTo(PLAY_RIGHT - 52, (innerY + PLAY_BOTTOM) / 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    function drawNet() {
      const x = W / 2;
      const top = PLAY_TOP;
      const bot = PLAY_BOTTOM;
      ctx.fillStyle = '#3a2a18';
      ctx.fillRect(x - 7, top - 6, 14, 16);
      ctx.fillRect(x - 7, bot - 10, 14, 16);
      ctx.fillStyle = '#f4f7f2';
      ctx.fillRect(x - 3, top, 6, bot - top);
      ctx.strokeStyle = 'rgba(255,255,255,0.28)';
      ctx.lineWidth = 1;
      for (let y = top + 8; y < bot - 6; y += 10) {
        ctx.beginPath();
        ctx.moveTo(x - 11, y);
        ctx.lineTo(x + 11, y + 5);
        ctx.stroke();
      }
      ctx.fillStyle = '#efe7ff';
      ctx.fillRect(x - 5, top, 10, 7);
      ctx.fillRect(x - 5, bot - 7, 10, 7);
    }

    function drawFrame() {
      ctx.fillStyle = '#f4f7f2';
      ctx.fillRect(0, 0, W, H);
      const pg = ctx.createLinearGradient(0, 0, W, H);
      pg.addColorStop(0, '#5a3480');
      pg.addColorStop(0.5, '#4b286d');
      pg.addColorStop(1, '#351c4d');
      ctx.fillStyle = pg;
      ctx.fillRect(WHITE, WHITE, W - WHITE * 2, H - WHITE * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 2;
      ctx.strokeRect(WHITE + 4, WHITE + 4, W - WHITE * 2 - 8, H - WHITE * 2 - 8);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      drawFrame();
      drawCrowd(WHITE + PURPLE, STAND);
      drawCrowd(PLAY_BOTTOM, STAND);
      drawCourtLines();
      drawNet();

      if (state === STATES.PLAYING || state === STATES.PAUSED || state === STATES.REMATCH) {
        drawPaddle(p1, assets.woodLight);
        drawPaddle(p2, assets.woodDark);
        drawBall();
      }

      const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, H * 0.78);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(8, 16, 8, 0.28)');
      ctx.fillStyle = vig;
      ctx.fillRect(PLAY_LEFT, PLAY_TOP, PLAY_RIGHT - PLAY_LEFT, PLAY_BOTTOM - PLAY_TOP);

      if (state === STATES.PLAYING && serveHold > 0) {
        ctx.fillStyle = 'rgba(20,8,32,0.35)';
        ctx.fillRect(W / 2 - 120, (PLAY_TOP + PLAY_BOTTOM) / 2 - 36, 240, 72);
        ctx.fillStyle = '#f7f3ff';
        ctx.font = 'bold 34px Trebuchet MS, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(serveHold > 18 ? 'Ready' : 'Play', W / 2, (PLAY_TOP + PLAY_BOTTOM) / 2);
      }

      renderOverlay();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    resetMatch();
    overlayDirty = true;
    updateHud();
    fitCourt();
    requestAnimationFrame(fitCourt);
    loop();
  </script>
</body>
</html>
